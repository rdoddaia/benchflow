# Deploys Qwen3-32B on TP8 with the operator-managed RHOAI batch gateway in
# sync dispatch mode. BenchFlow deploys the stack and prints the /v1/batches
# endpoint; drive the batch API with an external client authenticated by a
# Kubernetes service-account token (see docs/RHOAI_BATCH_GATEWAY.md).
apiVersion: benchflow.io/v1alpha1
kind: Experiment
metadata:
  name: batch-gateway-sync
spec:
  model:
    name:
      - Qwen/Qwen3-32B
  deployment_profile: batch-gateway-sync
  benchmark_profile: guidellm-smoke
  metrics_profile: detailed
  namespace: benchflow
  stages:
    # BenchFlow does not drive the /v1/batches API itself yet.
    benchmark: false
  overrides:
    runtime:
      # Diadochos validation is pinned to mt46x; its 8 H100s are freed by
      # scaling the legacy cybergym-vllm deployment in batch-bench to zero.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - diadochos-hqxzk-gpu-h100-mt46x
  mlflow:
    tags:
      accelerator: H100
      topology: tp8
  execution:
    timeout: 4h
